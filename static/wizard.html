<meta charset="utf-8">
<title>דוח תיאום הוצאות נסיעה לחו״ל | odcpa.co.il</title>
<style>
  :root {
    --purple: #7B2D8B;
    --purple-light: #c084d8;
    --purple-dark: #4a0a6b;
    --deep: #1a0030;
    --bg: #f4f0f8;
    --white: #fff;
    --border: #e0d0f0;
    --text: #1a0030;
    --muted: #7a6a8a;
    --green: #25D366;
    --green-bg: #e8f5e9;
    --green-text: #2e7d32;
    --red: #e53935;
    --red-bg: #fce4ec;
    --red-text: #c62828;
    --radius: 14px;
    --shadow: 0 4px 20px rgba(123,45,139,0.12);
    --grad: linear-gradient(135deg, #7B2D8B 0%, #4a0a6b 60%, #1a0030 100%);
    --grad-light: linear-gradient(135deg, #f8f4fc 0%, #ede0f8 100%);
    --focus: 0 0 0 3px rgba(123,45,139,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --purple: #c084d8;
      --purple-light: #e3c7ef;
      --purple-dark: #9b5cb0;
      --deep: #f1e9f8;
      --bg: #150a20;
      --white: #211230;
      --border: #3c2350;
      --text: #f1e9f8;
      --muted: #b9a6c9;
      --green: #3ddc84;
      --green-bg: #163524;
      --green-text: #6fe3a4;
      --red: #ff7a7a;
      --red-bg: #3a1f22;
      --red-text: #ff9a9a;
      --shadow: 0 4px 24px rgba(0,0,0,0.5);
      --grad: linear-gradient(135deg, #9b5cb0 0%, #6b2e85 60%, #2a0f3d 100%);
      --grad-light: linear-gradient(135deg, #2a1638 0%, #35204a 100%);
      --focus: 0 0 0 3px rgba(192,132,216,0.28);
    }
  }
  :root[data-theme="dark"] {
    --purple: #c084d8;
    --purple-light: #e3c7ef;
    --purple-dark: #9b5cb0;
    --deep: #f1e9f8;
    --bg: #150a20;
    --white: #211230;
    --border: #3c2350;
    --text: #f1e9f8;
    --muted: #b9a6c9;
    --green: #3ddc84;
    --green-bg: #163524;
    --green-text: #6fe3a4;
    --red: #ff7a7a;
    --red-bg: #3a1f22;
    --red-text: #ff9a9a;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --grad: linear-gradient(135deg, #9b5cb0 0%, #6b2e85 60%, #2a0f3d 100%);
    --grad-light: linear-gradient(135deg, #2a1638 0%, #35204a 100%);
    --focus: 0 0 0 3px rgba(192,132,216,0.28);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    direction: rtl;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    padding: 36px 16px 60px;
  }

  .stage { max-width: 640px; margin: 0 auto; }
  .stage-label { text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted); margin: 0 0 16px; }

  .browser { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .browser-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--grad-light); }
  .browser-url { flex: 1; background: var(--white); border: 1px solid var(--border); border-radius: 100px; padding: 5px 14px; font-size: 12px; color: var(--muted); direction: ltr; text-align: center; }
  .browser-lock { font-size: 12px; flex: none; }
  .browser-body { padding: 26px 26px 22px; min-height: 620px; display: flex; flex-direction: column; }

  /* header strip inside app, echoes WA dashboard header */
  .app-header { background: var(--grad); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; margin: -26px -26px 22px; border-radius: 12px 12px 0 0; }
  .app-header .logo-chip { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; padding: 5px; flex: none; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .app-header .logo-chip img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .app-header .t1 { color: #fff; font-size: .95rem; font-weight: 700; }
  .app-header .t2 { color: var(--purple-light); font-size: .75rem; margin-top: 1px; }

  /* stepper */
  .stepper { display: flex; align-items: center; margin-bottom: 24px; }
  .stepper .seg { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
  .stepper .seg .dot {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; background: var(--bg); color: var(--muted); border: 1.5px solid var(--border); z-index: 1;
  }
  .stepper .seg.done .dot { background: var(--green); border-color: var(--green); color: #fff; }
  .stepper .seg.active .dot { background: var(--grad); border-color: var(--purple-dark); color: #fff; }
  .stepper .seg .lbl { font-size: 10.5px; color: var(--muted); margin-top: 5px; text-align: center; }
  .stepper .seg.active .lbl, .stepper .seg.done .lbl { color: var(--text); font-weight: 700; }
  .stepper .line { position: absolute; top: 13px; height: 1.5px; background: var(--border); width: 100%; right: 50%; z-index: 0; }
  .stepper .seg:first-child .line { display: none; }
  .stepper .seg.done .line, .stepper .seg.active .line { background: var(--green); }

  h2.step-title { font-size: 1.15rem; font-weight: 800; color: var(--purple-dark); margin: 0 0 4px; }
  p.step-sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

  .section-title { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--purple); margin: 22px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-title:first-of-type { margin-top: 0; }
  .section-title::after { content:''; flex:1; height:1px; background: linear-gradient(90deg, var(--border), transparent); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .8rem; font-weight: 700; margin-bottom: 5px; color: var(--muted); }
  .field .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-row3 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
  input[type="text"], input[type="date"], input[type="number"], input[type="email"], select, textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 13px; font-size: .92rem;
    font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s; background: var(--white); color: var(--text);
  }
  textarea { resize: vertical; min-height: 66px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .day-chip:focus-visible, .tab-pill:focus-visible {
    border-color: var(--purple); box-shadow: var(--focus);
  }
  input.err, select.err, textarea.err { border-color: var(--red); }
  .err-msg { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }
  .err-msg.show { display: block; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: .88rem; font-weight: 700; font-family: inherit; transition: all .15s; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-primary { background: var(--grad); color: #fff; }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost { background: transparent; color: var(--purple); border: 1.5px solid var(--purple); }
  .btn-sm { padding: 6px 13px; font-size: .78rem; }

  /* pills / chips */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 20px; font-size: .78rem; font-weight: 700; background: var(--grad-light); color: var(--purple-dark); border: 1.5px solid var(--purple-light); }
  .chip button { border: none; background: var(--white); color: var(--purple-dark); width: 18px; height: 18px; border-radius: 50%; cursor: pointer; font-size: 11px; line-height: 1; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }

  .tab-strip { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab-pill { border: 1.5px solid var(--border); background: var(--white); color: var(--muted); border-radius: 100px; padding: 6px 15px; font-size: .8rem; font-weight: 700; cursor: pointer; }
  .tab-pill.active { background: var(--grad); border-color: var(--purple-dark); color: #fff; }

  /* day grid */
  .day-legend { display: flex; gap: 12px; margin-bottom: 12px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
  .day-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 7px; margin-bottom: 14px; }
  .day-chip { border: 1.5px solid var(--border); background: var(--white); border-radius: 9px; padding: 7px 3px 6px; text-align: center; cursor: pointer; font-size: 11.5px; line-height: 1.3; color: var(--muted); }
  .day-chip .d { font-weight: 700; font-size: 12.5px; color: var(--text); }
  .day-chip .m { font-size: 9.5px; }
  .day-chip .tag { display: block; margin-top: 3px; font-size: 9px; font-weight: 800; }
  .day-chip.business { background: var(--green-bg); border-color: var(--green); }
  .day-chip.business .tag { color: var(--green-text); }
  .day-chip.mixed { background: var(--grad-light); border-color: var(--purple-light); }
  .day-chip.mixed .tag { color: var(--purple-dark); }
  .day-chip.private { background: var(--bg); }
  .day-chip.private .tag { color: var(--muted); }
  .day-summary { background: var(--grad-light); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: var(--purple-dark); }
  .day-summary strong { color: var(--purple-dark); }

  /* expense cards */
  .exp-card { border: 1.5px solid var(--border); border-radius: 12px; padding: 16px 16px 14px; margin-bottom: 14px; background: var(--white); }
  .exp-card.disabled { opacity: .55; }
  .exp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .exp-head h3 { font-size: 1rem; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 8px; color: var(--purple-dark); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch { width: 34px; height: 19px; border-radius: 100px; background: var(--bg); border: 1px solid var(--border); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
  .switch.on { background: var(--grad-light); border-color: var(--purple-light); }
  .switch.on::after { background: var(--purple); transform: translateX(-15px); }

  .price-row { display: grid; grid-template-columns: 1.3fr 0.8fr 1fr; gap: 10px; }
  .filerow { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .filebtn { font: inherit; font-size: .8rem; font-weight: 700; color: var(--purple-dark); background: var(--grad-light); border: 1px solid var(--purple-light); border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .filechip { display: flex; align-items: center; gap: 8px; font-size: 12px; background: var(--green-bg); color: var(--green-text); border-radius: 100px; padding: 5px 6px 5px 12px; max-width: 100%; }
  .filechip span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filechip button { border: none; background: var(--white); color: var(--green-text); width: 18px; height: 18px; border-radius: 50%; cursor: pointer; font-size: 11px; }

  .info-card { border: 1.5px dashed var(--purple-light); background: var(--grad-light); border-radius: 12px; padding: 14px 16px; font-size: 13px; color: var(--purple-dark); display: flex; gap: 10px; align-items: flex-start; }
  .info-card .ic { font-size: 18px; flex: none; }
  .fx-note { font-size: 11.5px; color: var(--muted); margin: -8px 0 16px; display: flex; gap: 6px; align-items: center; }

  /* summary */
  .sum-block { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; background: var(--white); }
  .sum-block .hd { background: var(--grad-light); padding: 10px 16px; font-weight: 800; font-size: .85rem; color: var(--purple-dark); border-bottom: 1px solid var(--border); }
  .sum-block .bd { padding: 12px 16px; }
  .sum-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--border); }
  .sum-row:last-child { border-bottom: none; }
  .sum-row .v { color: var(--muted); }
  .checklist { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .checklist li { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--muted); }
  .checklist li .ok { color: var(--green-text); font-weight: 800; }
  .checklist li .no { color: var(--red-text); font-weight: 800; }

  .declare { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--text); background: var(--grad-light); border: 1px solid var(--purple-light); border-radius: 10px; padding: 12px 14px; margin-top: 14px; cursor: pointer; line-height: 1.55; }
  .declare input { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--purple); flex: none; }

  .draft-banner { display: flex; align-items: center; gap: 10px; background: var(--grad-light); border: 1px solid var(--purple-light); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 12.5px; }
  .draft-banner .link { font-family: 'JetBrains Mono', Consolas, monospace; direction: ltr; font-size: 11.5px; color: var(--purple-dark); background: var(--white); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .draft-banner button { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; flex: none; }

  /* nav */
  .nav-row { margin-top: auto; padding-top: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  /* confirmation */
  .confirm { text-align: center; padding: 30px 10px; margin: auto 0; }
  .confirm .mark { width: 60px; height: 60px; border-radius: 50%; background: var(--green-bg); color: var(--green-text); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 18px; }
  .confirm h2 { font-size: 1.2rem; font-weight: 800; margin: 0 0 10px; color: var(--purple-dark); }
  .confirm p { color: var(--muted); font-size: 14px; max-width: 42ch; margin: 0 auto; }
  .confirm .em { color: var(--text); font-weight: 700; }

  .below-note { max-width: 640px; margin: 18px auto 0; text-align: center; font-size: 12px; color: var(--muted); }

  @media (max-width: 480px) {
    .form-row, .price-row { grid-template-columns: 1fr; }
    .browser-body { padding: 20px 16px 18px; }
    .app-header { margin: -20px -16px 20px; }
    .stepper .seg .lbl { display: none; }
  }
</style>

<div class="stage">
  <div class="browser">
    <div class="browser-body" id="wizard"></div>
  </div>
</div>

<script>
(function(){
  var STEP_LABELS = ["פרטי נסיעה", "יומן ימים", "הוצאות", "סיכום ושליחה"];

  var COUNTRIES = ["אוסטרליה","אוסטריה","איטליה","איסלנד","אירלנד","בלגיה","גרמניה","דובאי","דנמרק","הולנד","הונג קונג","בריטניה","טייוואן","יוון","יפן","לוקסמבורג","נורווגיה","ספרד","עומאן","פינלנד","צרפת","קטאר","דרום קוריאה","קנדה","שוודיה","שוויץ","ארה״ב","טורקיה","קפריסין","פורטוגל","פולין","צ׳כיה","הונגריה","איחוד האמירויות","הודו","סין","תאילנד","ברזיל"].sort(function(a,b){ return a.localeCompare(b,'he'); });

  function newTraveler(id, name, role){
    return { id: id, name: name, role: role, days: [], rangeKey: null,
      flight: { price:'', currency:'USD', cls:'economy', file:null },
      lodging: { hotel:'', costPerNight:'', currency:'USD', file:null },
      car: { enabled:false, days:'', costPerDay:'', currency:'USD', file:null } };
  }

  var state = {
    tripId: null,
    apiError: '',
    submitError: '',
    step: 0,
    trip: { contactName:'', contactEmail:'', destination:'', country:'', startDate:'', endDate:'', purpose:'', purposeExplanation:'', proofFile:null },
    travelers: [ newTraveler('t0', 'אני (הלקוח)', 'primary') ],
    activeTraveler: 't0',
    newCompanion: { name:'', role:'עובד/ת' },
    legalConfirmed: false,
    legalTouched: false,
    draft: { saved:false, token:null, busy:false },
    submitted: false,
    submitting: false,
    submissionId: null,
    gate: { verified:false, email:'', otpSent:false, otpInput:'', error:'', busy:false },
    fileError: null
  };

  var MAX_FILE_MB = 10;
  var ALLOWED_FILE_TYPES = ['application/pdf', 'image/jpeg', 'image/png'];
  var ALLOWED_ACCEPT = 'application/pdf,image/jpeg,image/png';

  function apiSendOtp(email){
    return fetch('/api/otp/send', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body: JSON.stringify({email:email}) })
      .then(function(r){ return r.json(); }).catch(function(){ return {ok:false, error:'שגיאת רשת.'}; });
  }
  function apiVerifyOtp(email, code){
    return fetch('/api/otp/verify', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body: JSON.stringify({email:email, code:code}) })
      .then(function(r){ return r.json(); }).catch(function(){ return {ok:false, error:'שגיאת רשת.'}; });
  }
  function apiStartTrip(){
    return fetch('/api/trips/start', { method:'POST', credentials:'same-origin' })
      .then(function(r){ return r.json().then(function(j){ return Object.assign({ok:r.ok}, j); }); })
      .catch(function(){ return {ok:false, error:'שגיאת רשת.'}; });
  }
  function apiUploadFile(file){
    var fd = new FormData(); fd.append('file', file);
    return fetch('/api/trips/'+state.tripId+'/upload', { method:'POST', credentials:'same-origin', body: fd })
      .then(function(r){ return r.json(); }).catch(function(){ return {ok:false, error:'שגיאת רשת.'}; });
  }

  function fileVal(f){ return f ? f.ref : null; }

  function serializeTraveler(t){
    return {
      name: t.name, role: t.role,
      days: t.days.map(function(d){ return {date:d.date, status:d.status}; }),
      flight_price: t.flight.price ? Number(t.flight.price) : null,
      flight_currency: t.flight.currency, flight_class: t.flight.cls,
      flight_file_ref: fileVal(t.flight.file),
      lodging_hotel: t.lodging.hotel,
      lodging_cost: t.lodging.costPerNight ? Number(t.lodging.costPerNight) : null,
      lodging_currency: t.lodging.currency,
      lodging_file_ref: fileVal(t.lodging.file),
      car_enabled: !!t.car.enabled,
      car_days: t.car.days ? Number(t.car.days) : null,
      car_cost_per_day: t.car.costPerDay ? Number(t.car.costPerDay) : null,
      car_currency: t.car.currency,
      car_file_ref: fileVal(t.car.file),
    };
  }

  function serializePayload(){
    var t = state.trip;
    return {
      trip: {
        contact_name: t.contactName, destination: t.destination, country: t.country,
        start_date: t.startDate, end_date: t.endDate,
        purpose: t.purpose, purpose_explanation: t.purposeExplanation,
        proof_file_ref: fileVal(t.proofFile),
      },
      travelers: state.travelers.map(serializeTraveler),
      legal_confirmed: state.legalConfirmed,
    };
  }

  function apiSaveDraft(){
    return fetch('/api/trips/'+state.tripId+'/draft', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body: JSON.stringify(serializePayload()) })
      .then(function(r){ return r.json(); }).catch(function(){ return {ok:false, error:'שגיאת רשת.'}; });
  }
  function apiSubmitTrip(){
    return fetch('/api/trips/'+state.tripId+'/submit', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body: JSON.stringify(serializePayload()) })
      .then(function(r){ return r.json().then(function(j){ return Object.assign({ok:r.ok}, j); }); })
      .catch(function(){ return {ok:false, error:'שגיאת רשת.'}; });
  }

  function get(obj, path){ return path.split('.').reduce(function(o,k){ return o ? o[k] : undefined; }, obj); }
  function set(obj, path, val){ var p = path.split('.'); var cur = obj; for (var i=0;i<p.length-1;i++){ cur = cur[p[i]]; } cur[p[p.length-1]] = val; }
  function activeT(){ return state.travelers.find(function(t){ return t.id === state.activeTraveler; }); }
  function escapeHtml(str){ return (str||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function toLocalISO(d){ var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }
  function fmtDay(dateStr){ var d = new Date(dateStr+'T00:00:00'); return { wd: d.toLocaleDateString('he-IL',{weekday:'short'}), dm: d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'}) }; }

  function generateDays(trav){
    var s = state.trip.startDate, e = state.trip.endDate;
    if (!s || !e) { trav.days = []; return; }
    var key = s+'_'+e;
    if (key === trav.rangeKey && trav.days.length) return;
    trav.rangeKey = key;
    var start = new Date(s+'T00:00:00'), end = new Date(e+'T00:00:00');
    var days = [], cur = new Date(start), guard = 0;
    while (cur <= end && guard < 60) { days.push({ date: toLocalISO(cur), status: 'business' }); cur.setDate(cur.getDate()+1); guard++; }
    trav.days = days;
  }
  function cycleStatus(s){ return s==='business' ? 'mixed' : (s==='mixed' ? 'private' : 'business'); }
  function statusLabel(s){ return s==='business' ? 'עסקי' : (s==='mixed' ? 'מעורב' : 'פרטי'); }

  function countryOptions(selected){
    var html = '<option value="">בחר/י מדינה</option>';
    COUNTRIES.forEach(function(c){ html += '<option value="'+c+'"'+(selected===c?' selected':'')+'>'+c+'</option>'; });
    html += '<option value="מדינה אחרת"'+(selected==='מדינה אחרת'?' selected':'')+'>מדינה אחרת</option>';
    return html;
  }

  function fileRow(path, file, label){
    var err = (state.fileError && state.fileError.path === path) ? state.fileError.message : null;
    var isUploading = state.uploadingPath === path;
    return '<div class="filerow">'
      + (file
          ? '<div class="filechip"><span class="name">&#128206; '+escapeHtml(file.name)+'</span><button data-action="remove-file" data-path="'+path+'" aria-label="הסרת קובץ">&times;</button></div>'
          : '<button type="button" class="filebtn" data-action="pick-file" data-path="'+path+'"'+(isUploading?' disabled':'')+'>'+(isUploading?'מעלה…':label)+'</button>')
      + '</div>'
      + (file ? '' : '<p class="hint" style="margin-top:4px">PDF או תמונה (JPG/PNG), עד '+MAX_FILE_MB+'MB</p>')
      + (err ? '<p class="err-msg show">'+err+'</p>' : '');
  }

  function currencySelect(path, val){
    var opts = ['USD','EUR','GBP','ILS'];
    return '<select data-bind="'+path+'">' + opts.map(function(c){ return '<option value="'+c+'"'+(val===c?' selected':'')+'>'+c+'</option>'; }).join('') + '</select>';
  }

  function renderStepper(){
    var html = '<div class="stepper">';
    STEP_LABELS.forEach(function(lbl, i){
      var cls = i === state.step ? 'active' : (i < state.step ? 'done' : '');
      html += '<div class="seg '+cls+'"><div class="line"></div><div class="dot">'+(i<state.step?'✓':(i+1))+'</div><div class="lbl">'+lbl+'</div></div>';
    });
    return html + '</div>';
  }

  function step0(){
    var t = state.trip;
    var showPurposeExtra = !!t.purpose;
    var companionsHtml = state.travelers.filter(function(tr){ return tr.role !== 'primary'; }).map(function(tr){
      return '<span class="chip">'+escapeHtml(tr.name)+' · '+escapeHtml(tr.role)+'<button data-action="remove-companion" data-id="'+tr.id+'" aria-label="הסרה">&times;</button></span>';
    }).join('');

    return ''
      + '<h2 class="step-title">לאן ולמה נסעת?</h2>'
      + '<p class="step-sub">הפרטים כאן קובעים את מסגרת הדוח ואת הבסיס להכרה בהוצאות.</p>'

      + '<div class="section-title">פרטים שלך</div>'
      + '<div class="form-row">'
      + '<div class="field"><label>שם מלא</label><input type="text" data-bind="trip.contactName" value="'+escapeHtml(t.contactName)+'" placeholder="ישראל ישראלי"></div>'
      + '<div class="field"><label>אימייל לקבלת עותק</label><input type="email" data-bind="trip.contactEmail" value="'+escapeHtml(t.contactEmail)+'" placeholder="name@company.co.il"></div>'
      + '</div>'

      + '<div class="section-title">יעד ותאריכים</div>'
      + '<div class="field"><label>מדינה</label><select data-bind="trip.country">'+countryOptions(t.country)+'</select>'
      + '<p class="hint">הרשימה סגורה בכוונה, כך שמנוע התיאום תמיד יודע בדיוק אילו כללים להפעיל על היעד שנבחר.</p></div>'
      + '<div class="field"><label>עיר / יעד מדויק</label><input type="text" data-bind="trip.destination" value="'+escapeHtml(t.destination)+'" placeholder="למשל: מינכן"></div>'
      + '<div class="form-row">'
      + '<div class="field"><label>תאריך יציאה</label><input type="date" data-bind="trip.startDate" value="'+t.startDate+'"></div>'
      + '<div class="field"><label>תאריך חזרה</label><input type="date" data-bind="trip.endDate" value="'+t.endDate+'"></div>'
      + '</div>'

      + '<div class="section-title">מטרת הנסיעה</div>'
      + '<div class="field"><label>מטרה</label><select data-bind="trip.purpose">'
      + '<option value="">בחר/י מטרה</option>'
      + ['פגישות לקוחות','תערוכה מקצועית','כנס מקצועי','הדרכה / הכשרה','אחר'].map(function(c){ return '<option value="'+c+'"'+(t.purpose===c?' selected':'')+'>'+c+'</option>'; }).join('')
      + '</select></div>'
      + (showPurposeExtra ? (
          '<div class="field"><label>הסבר קצר על מטרת הנסיעה</label>'
          + '<textarea data-bind="trip.purposeExplanation" placeholder="למשל: פגישות עם שני לקוחות קיימים בגרמניה לסגירת חוזה שנתי">'+escapeHtml(t.purposeExplanation)+'</textarea>'
          + '<p class="hint">ההסבר הזה מופיע בעמוד הראשון של הדוח ותומך בעמידה בתנאי הסף של התקנות.</p></div>'
          + '<div class="field"><label>הוכחה למטרת הנסיעה (אופציונלי)</label>'
          + fileRow('trip.proofFile', t.proofFile, 'צירוף הזמנה / כרטיס כניסה / מכתב הזמנה')
          + '</div>'
        ) : '')

      + '<div class="section-title">מי נוסע</div>'
      + '<div class="chip-row">' + (companionsHtml || '<span class="hint">רק אתה רשום כרגע בנסיעה זו.</span>') + '</div>'
      + '<div class="form-row3">'
      + '<input type="text" id="comp-name" placeholder="שם המלווה" value="'+escapeHtml(state.newCompanion.name)+'" data-bind="newCompanion.name">'
      + '<select id="comp-role" data-bind="newCompanion.role">'
      + ['עובד/ת','בן/בת זוג','שותף/ה עסקי/ת','אחר'].map(function(r){ return '<option'+(state.newCompanion.role===r?' selected':'')+'>'+r+'</option>'; }).join('')
      + '</select></div>'
      + '<button type="button" class="btn btn-secondary btn-sm" style="margin-top:8px" data-action="add-companion">+ הוספת מלווה לנסיעה</button>'
      + '<p class="hint" style="margin-top:8px">לכל מלווה (למשל עובד שנסע איתך) יבנה יומן ימים והוצאות נפרדים משלו — ההכרה מחושבת לכל אדם בנפרד.</p>'

      + '<p class="err-msg" id="err0">נא למלא שם, אימייל, יעד, תאריכים תקינים, מטרה והסבר קצר לפני שממשיכים.</p>';
  }

  function travelerTabs(){
    if (state.travelers.length < 2) return '';
    var html = '<div class="tab-strip">';
    state.travelers.forEach(function(tr){
      html += '<button type="button" class="tab-pill'+(tr.id===state.activeTraveler?' active':'')+'" data-action="switch-traveler" data-id="'+tr.id+'">'+escapeHtml(tr.name)+'</button>';
    });
    return html + '</div>';
  }

  function step1(){
    var trav = activeT();
    generateDays(trav);
    var biz = trav.days.filter(function(d){return d.status==='business';}).length;
    var mixed = trav.days.filter(function(d){return d.status==='mixed';}).length;
    var priv = trav.days.filter(function(d){return d.status==='private';}).length;
    var grid = trav.days.map(function(d,i){
      var f = fmtDay(d.date);
      return '<div class="day-chip '+d.status+'" tabindex="0" data-action="cycle-day" data-index="'+i+'">'
        + '<span class="d">'+f.dm+'</span><span class="m">'+f.wd+'</span><span class="tag">'+statusLabel(d.status)+'</span></div>';
    }).join('');
    if (!trav.days.length) grid = '<p class="hint">נא להזין תאריכי נסיעה בשלב הקודם כדי לבנות את יומן הימים.</p>';

    return ''
      + '<h2 class="step-title">איזה ימים היו עסקיים?</h2>'
      + '<p class="step-sub">לחיצה על יום מחליפה את הסיווג שלו. רק ימים עסקיים ומעורבים נכנסים לחישוב התיאום.</p>'
      + travelerTabs()
      + '<div class="day-legend">'
      + '<span><i class="swatch" style="background:var(--green)"></i>עסקי — מוכר במלואו</span>'
      + '<span><i class="swatch" style="background:var(--purple)"></i>מעורב — נסיעה/חלקי</span>'
      + '<span><i class="swatch" style="background:var(--muted)"></i>פרטי — לא נכלל</span>'
      + '</div>'
      + '<div class="day-grid">'+grid+'</div>'
      + (trav.days.length ? '<div class="day-summary"><strong>'+biz+'</strong> ימי עסקים · <strong>'+mixed+'</strong> ימי נסיעה מעורבים · <strong>'+priv+'</strong> ימים פרטיים, מתוך <strong>'+trav.days.length+'</strong> לילות בסה״כ ('+escapeHtml(trav.name)+')</div>' : '');
  }

  function step2(){
    var trav = activeT();
    var f = trav.flight, l = trav.lodging, c = trav.car;
    var nights = trav.days.length ? Math.max(trav.days.length - 1, 0) : null;
    var bizDays = trav.days.filter(function(d){return d.status!=='private';}).length;

    return ''
      + '<h2 class="step-title">מה עלה הכסף?</h2>'
      + '<p class="step-sub">לכל קטגוריה — סכום, מטבע וקובץ מצורף.</p>'
      + travelerTabs()
      + '<div class="fx-note">&#128176; כל הסכומים מומרים לשקלים לפי שער יציג של בנק ישראל ליום התשלום בפועל.</div>'

      + '<div class="exp-card"><div class="exp-head"><h3>✈️ טיסה</h3></div>'
      + '<div class="price-row">'
      + '<div class="field" style="margin-bottom:0"><label>מחיר כרטיס</label><input type="number" min="0" data-bind="flight.price" value="'+f.price+'" placeholder="0"></div>'
      + '<div class="field" style="margin-bottom:0"><label>מטבע</label>'+currencySelect('flight.currency', f.currency)+'</div>'
      + '<div class="field" style="margin-bottom:0"><label>מחלקה</label><select data-bind="flight.cls">'
      + ['economy:תיירים','business:עסקים','first:ראשונה'].map(function(o){ var kv=o.split(':'); return '<option value="'+kv[0]+'"'+(f.cls===kv[0]?' selected':'')+'>'+kv[1]+'</option>'; }).join('')
      + '</select></div></div>'
      + '<div style="margin-top:10px">'+fileRow('flight.file', f.file, 'צירוף כרטיס טיסה / חשבונית')+'</div>'
      + '</div>'

      + '<div class="exp-card"><div class="exp-head"><h3>🏨 לינה</h3></div>'
      + '<div class="field"><label>שם המלון</label><input type="text" data-bind="lodging.hotel" value="'+escapeHtml(l.hotel)+'" placeholder="שם המלון"></div>'
      + '<div class="price-row">'
      + '<div class="field" style="margin-bottom:0"><label>עלות ללילה</label><input type="number" min="0" data-bind="lodging.costPerNight" value="'+l.costPerNight+'" placeholder="0"></div>'
      + '<div class="field" style="margin-bottom:0"><label>מטבע</label>'+currencySelect('lodging.currency', l.currency)+'</div>'
      + '<div class="field" style="margin-bottom:0"><label>לילות</label><input type="text" value="'+(nights===null?'—':nights)+' (מהיומן)" disabled style="color:var(--muted);background:var(--bg)"></div>'
      + '</div>'
      + '<div style="margin-top:10px">'+fileRow('lodging.file', l.file, 'צירוף חשבונית מלון')+'</div>'
      + '</div>'

      + '<div class="exp-card'+(c.enabled?'':' disabled')+'"><div class="exp-head"><h3>🚗 רכב שכור</h3>'
      + '<div class="toggle" data-action="toggle-car"><span>כלול בנסיעה</span><span class="switch '+(c.enabled?'on':'')+'"></span></div></div>'
      + (c.enabled ? (
          '<div class="price-row">'
          + '<div class="field" style="margin-bottom:0"><label>ימי השכרה</label><input type="number" min="0" data-bind="car.days" value="'+c.days+'" placeholder="0"></div>'
          + '<div class="field" style="margin-bottom:0"><label>מטבע</label>'+currencySelect('car.currency', c.currency)+'</div>'
          + '<div class="field" style="margin-bottom:0"><label>עלות יומית</label><input type="number" min="0" data-bind="car.costPerDay" value="'+c.costPerDay+'" placeholder="0"></div>'
          + '</div><div style="margin-top:10px">'+fileRow('car.file', c.file, 'צירוף חוזה / קבלת השכרה')+'</div>'
        ) : '<p class="hint">לא נכלל בדוח זה.</p>')
      + '</div>'

      + '<div class="info-card"><span class="ic">🍽️</span><span><strong>אש״ל לא דורש העלאת קבלות.</strong> הסכום נרשם אוטומטית כתעריף יומי קבוע לפי מספר הימים העסקיים ביומן שלך ('+bizDays+' ימים עבור '+escapeHtml(trav.name)+') — בהתאם לתקנות מס הכנסה.</span></div>';
  }

  function step3(){
    var t = state.trip;
    var checklist = [
      { ok: !!t.purpose && !!t.purposeExplanation, txt: 'מטרת נסיעה עסקית הוגדרה והוסברה' },
      { ok: state.travelers.every(function(tr){ return tr.days.length>0; }), txt: 'ימים עסקיים מול פרטיים סווגו לכל הנוסעים' },
      { ok: state.travelers.every(function(tr){ return !!tr.flight.file; }), txt: 'קובצי טיסה צורפו' },
      { ok: state.travelers.every(function(tr){ return !!tr.lodging.file; }), txt: 'קובצי לינה צורפו' }
    ];
    var travBlocks = state.travelers.map(function(tr){
      var biz = tr.days.filter(function(d){return d.status!=='private';}).length;
      return '<div class="sum-block"><div class="hd">'+escapeHtml(tr.name)+' · '+escapeHtml(tr.role==='primary'?'לקוח':tr.role)+'</div><div class="bd">'
        + '<div class="sum-row"><span>ימים עסקיים</span><span class="v">'+biz+' מתוך '+tr.days.length+'</span></div>'
        + '<div class="sum-row"><span>טיסה</span><span class="v">'+(tr.flight.price?tr.flight.price+' '+tr.flight.currency:'—')+(tr.flight.file?' · קובץ מצורף':'')+'</span></div>'
        + '<div class="sum-row"><span>לינה</span><span class="v">'+(tr.lodging.costPerNight?tr.lodging.costPerNight+' '+tr.lodging.currency+' / לילה':'—')+(tr.lodging.file?' · קובץ מצורף':'')+'</span></div>'
        + '<div class="sum-row"><span>רכב שכור</span><span class="v">'+(tr.car.enabled?(tr.car.days||'0')+' ימים':'לא נכלל')+'</span></div>'
        + '<div class="sum-row"><span>אש״ל</span><span class="v">תעריף קבוע אוטומטי</span></div>'
        + '</div></div>';
    }).join('');

    return ''
      + '<h2 class="step-title">בדיקה אחרונה לפני שליחה</h2>'
      + '<p class="step-sub">רואה החשבון יקבל את זה בדיוק כפי שמופיע כאן, יחד עם מנוע חישוב התיאום.</p>'
      + '<div class="sum-block"><div class="hd">נסיעה</div><div class="bd">'
      + '<div class="sum-row"><span>יעד</span><span class="v">'+escapeHtml(t.destination||'—')+', '+escapeHtml(t.country||'—')+'</span></div>'
      + '<div class="sum-row"><span>תאריכים</span><span class="v">'+(t.startDate||'—')+' – '+(t.endDate||'—')+'</span></div>'
      + '<div class="sum-row"><span>מטרה</span><span class="v">'+escapeHtml(t.purpose||'—')+'</span></div>'
      + '<div class="sum-row"><span>מספר נוסעים</span><span class="v">'+state.travelers.length+'</span></div>'
      + '</div></div>'
      + travBlocks
      + '<div class="sum-block"><div class="hd">עמידה בתנאים</div><div class="bd"><ul class="checklist">'
      + checklist.map(function(c){ return '<li><span class="'+(c.ok?'ok':'no')+'">'+(c.ok?'✓':'○')+'</span>'+c.txt+'</li>'; }).join('')
      + '</ul></div></div>'
      + '<label class="declare"><input type="checkbox" data-action="toggle-legal"'+(state.legalConfirmed?' checked':'')+'>'
      + '<span>מאשר/ת כי הפרטים שמסרתי בטופס זה נכונים ומלאים למיטב ידיעתי, וכי מטרת הנסיעה כפי שתוארה משקפת נאמנה את פעילותי העסקית בפועל.</span></label>'
      + (state.legalTouched && !state.legalConfirmed ? '<p class="err-msg show" style="margin-top:0">יש לאשר את ההצהרה לפני שליחה.</p>' : '');
  }

  function confirmScreen(){
    var email = state.trip.contactEmail || 'כתובת המייל שהזנת';
    return ''
      + '<div class="confirm"><div class="mark">&#10003;</div>'
      + '<h2>הטופס נשלח</h2>'
      + '<p>עותק מלא של הטופס נשלח לכתובת <span class="em">'+escapeHtml(email)+'</span> ולרואה החשבון שלך.</p>'
      + '<p style="font-size:11.5px;color:var(--muted);margin-top:14px">מספר אסמכתא: '+state.submissionId+'</p>'
      + '</div>';
  }

  function gateScreen(){
    var g = state.gate;
    if (!g.otpSent) {
      return ''
        + '<div class="confirm" style="padding-top:10px">'
        + '<h2 style="margin-bottom:6px">אימות זהות לפני מילוי הטופס</h2>'
        + '<p style="margin-bottom:20px">נשלח קוד חד-פעמי לאימייל שלך, כדי לוודא שרק את/ה יכול/ה לגשת לפרטי הנסיעה.</p>'
        + '<div class="field" style="text-align:right;max-width:320px;margin:0 auto 14px">'
        + '<label>כתובת אימייל</label>'
        + '<input type="email" id="gate-email" value="'+escapeHtml(g.email)+'" placeholder="name@company.co.il">'
        + (g.error ? '<p class="err-msg show">'+g.error+'</p>' : '')
        + '</div>'
        + '<button class="btn btn-primary" data-action="send-otp"'+(g.busy?' disabled':'')+'>'+(g.busy?'שולח…':'שליחת קוד אימות')+'</button>'
        + '</div>';
    }
    return ''
      + '<div class="confirm" style="padding-top:10px">'
      + '<h2 style="margin-bottom:6px">הזנת קוד אימות</h2>'
      + '<p style="margin-bottom:20px">שלחנו קוד בן 6 ספרות לכתובת <span class="em">'+escapeHtml(g.email)+'</span>. הקוד בתוקף ל-10 דקות.</p>'
      + '<div class="field" style="text-align:right;max-width:220px;margin:0 auto 14px">'
      + '<label>קוד בן 6 ספרות</label>'
      + '<input type="text" inputmode="numeric" maxlength="6" id="gate-otp" value="'+escapeHtml(g.otpInput)+'" placeholder="000000" style="text-align:center;letter-spacing:.3em;font-family:Consolas,monospace;font-size:1.1rem">'
      + (g.error ? '<p class="err-msg show">'+g.error+'</p>' : '')
      + '</div>'
      + '<button class="btn btn-primary" data-action="verify-otp"'+(g.busy?' disabled':'')+'>'+(g.busy?'מאמת…':'אימות')+'</button> '
      + '<button class="btn btn-ghost btn-sm" data-action="resend-otp" style="margin-inline-start:8px"'+(g.busy?' disabled':'')+'>שליחה מחדש</button>'
      + '</div>';
  }

        content += '<div class="draft-banner"><span>💾</span><span>הטיוטה נשמרה'+(state.trip.contactEmail?' ונשלח קישור לאימייל שלך':'')+'. הקישור אישי, חד-פעמי ובתוקף ל-7 ימים.</span>'
          + '<span class="link">…/draft/'+state.draft.token.slice(0,18)+'…</span>'
          + '<button type="button" data-action="dismiss-draft" aria-label="סגירה">&times;</button></div>';
      }
      content += renderStepper();
      content += ({0: step0, 1: step1, 2: step2, 3: step3})[state.step]();
      if (state.submitError) content += '<p class="err-msg show">'+escapeHtml(state.submitError)+'</p>';
      if (state.apiError) content += '<p class="err-msg show">'+escapeHtml(state.apiError)+'</p>';
      content += '<div class="nav-row">'
        + (state.step > 0 ? '<button class="btn btn-secondary" data-action="back">חזרה</button>' : '<span></span>')
        + '<div style="display:flex;gap:8px">'
        + (state.step < 3 ? '<button class="btn btn-secondary" data-action="save-draft"'+(state.draft.busy?' disabled':'')+'>💾 '+(state.draft.busy?'שומר…':'שמירה כטיוטה')+'</button>' : '')
        + (state.step < 3
            ? '<button class="btn btn-primary" data-action="next">המשך</button>'
            : '<button class="btn btn-primary" data-action="submit"'+(state.submitting?' disabled':'')+'>'+(state.submitting?'שולח…':'שליחה לבדיקת רואה החשבון')+'</button>')
        + '</div></div>';
    }
    body.innerHTML = content;
  }

  function validateStep0(){
    var t = state.trip;
    var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t.contactEmail || '');
    var ok = t.contactName && emailOk && t.destination && t.country && t.startDate && t.endDate && t.endDate >= t.startDate && t.purpose && t.purposeExplanation;
    var err = document.getElementById('err0');
    if (err) err.classList.toggle('show', !ok);
    return ok;
  }

  var wizard = document.getElementById('wizard');

  wizard.addEventListener('click', function(e){
    var actEl = e.target.closest('[data-action]');
    if (!actEl) return;
    var action = actEl.dataset.action;

    if (action === 'next') {
      if (state.step === 0 && !validateStep0()) return;
      state.step++; render();
    } else if (action === 'back') {
      state.step--; render();
    } else if (action === 'submit') {
      if (state.submitting || state.submitted) return; // double-submit guard, client-side; server also rejects via trip status
      if (!state.legalConfirmed) { state.legalTouched = true; render(); return; }
      state.submitting = true;
      state.submitError = '';
      render(); // re-render immediately: button becomes disabled + shows "שולח..."
      apiSubmitTrip().then(function(res){
        state.submitting = false;
        if (!res.ok) {
          state.submitError = res.error || 'שגיאה בשליחת הטופס. נסה/י שוב.';
          render();
          return;
        }
        state.submissionId = res.submission_id;
        state.submitted = true;
        render();
      });
    } else if (action === 'toggle-legal') {
      state.legalConfirmed = !state.legalConfirmed;
      state.legalTouched = true;
      render();
    } else if (action === 'save-draft') {
      state.draft.busy = true; render();
      apiSaveDraft().then(function(res){
        state.draft.busy = false;
        if (!res.ok) { state.apiError = res.error || 'שגיאה בשמירת הטיוטה.'; render(); return; }
        state.draft.token = res.token;
        state.draft.saved = true;
        render();
      });
    } else if (action === 'dismiss-draft') {
      state.draft.saved = false; render();
    } else if (action === 'send-otp') {
      var email = (document.getElementById('gate-email').value || '').trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { state.gate.error = 'נא להזין כתובת אימייל תקינה.'; render(); return; }
      state.gate.email = email;
      state.gate.busy = true; render();
      apiSendOtp(email).then(function(res){
        state.gate.busy = false;
        if (!res.ok) { state.gate.error = res.error || 'שגיאה בשליחת הקוד.'; render(); return; }
        state.gate.otpSent = true;
        state.gate.error = '';
        render();
      });
    } else if (action === 'resend-otp') {
      state.gate.busy = true; render();
      apiSendOtp(state.gate.email).then(function(res){
        state.gate.busy = false;
        state.gate.error = res.ok ? '' : (res.error || 'שגיאה בשליחת הקוד.');
        render();
      });
    } else if (action === 'verify-otp') {
      var entered = (document.getElementById('gate-otp').value || '').trim();
      state.gate.busy = true; render();
      apiVerifyOtp(state.gate.email, entered).then(function(res){
        if (!res.ok) { state.gate.busy = false; state.gate.error = res.error || 'הקוד שגוי.'; render(); return; }
        return apiStartTrip().then(function(startRes){
          state.gate.busy = false;
          if (!startRes.ok) { state.gate.error = startRes.error || 'שגיאה בהתחלת הטופס.'; render(); return; }
          state.tripId = startRes.trip_id;
          state.gate.verified = true;
          state.trip.contactEmail = state.gate.email;
          render();
        });
      });
    } else if (action === 'cycle-day') {
      var trav = activeT();
      var i = +actEl.dataset.index;
      trav.days[i].status = cycleStatus(trav.days[i].status);
      render();
    } else if (action === 'toggle-car') {
      activeT().car.enabled = !activeT().car.enabled; render();
    } else if (action === 'remove-file') {
      var t = activeT();
      var path = actEl.dataset.path;
      if (path.indexOf('trip.') === 0) set(state, path, null); else set(t, path, null);
      render();
    } else if (action === 'pick-file') {
      var path2 = actEl.dataset.path;
      var input = document.createElement('input');
      input.type = 'file'; input.accept = ALLOWED_ACCEPT; input.style.display = 'none';
      input.addEventListener('change', function(){
        var f = input.files && input.files[0];
        if (f) {
          var tooBig = f.size > MAX_FILE_MB * 1024 * 1024;
          var badType = ALLOWED_FILE_TYPES.indexOf(f.type) === -1;
          if (tooBig || badType) {
            state.fileError = { path: path2, message: tooBig ? ('הקובץ גדול מ-'+MAX_FILE_MB+'MB.') : 'רק PDF או תמונה (JPG/PNG).' };
            render();
          } else {
            state.fileError = null;
            state.uploadingPath = path2;
            render();
            apiUploadFile(f).then(function(res){
              state.uploadingPath = null;
              if (!res.ok) {
                state.fileError = { path: path2, message: res.error || 'שגיאה בהעלאת הקובץ.' };
                render();
                return;
              }
              var t2 = activeT();
              var value = { ref: res.ref, name: res.filename };
              if (path2.indexOf('trip.') === 0) set(state, path2, value); else set(t2, path2, value);
              render();
            });
          }
        }
        input.remove();
      });
      document.body.appendChild(input); input.click();
    } else if (action === 'switch-traveler') {
      state.activeTraveler = actEl.dataset.id; render();
    } else if (action === 'add-companion') {
      var name = (state.newCompanion.name || '').trim();
      if (!name) return;
      var id = 't' + (state.travelers.length + Math.floor(Math.random()*1000));
      var tr = newTraveler(id, name, state.newCompanion.role);
      generateDays(tr);
      state.travelers.push(tr);
      state.newCompanion = { name:'', role:'עובד/ת' };
      render();
    } else if (action === 'remove-companion') {
      var rid = actEl.dataset.id;
      state.travelers = state.travelers.filter(function(tr){ return tr.id !== rid; });
      if (state.activeTraveler === rid) state.activeTraveler = state.travelers[0].id;
      render();
    }
  });

  wizard.addEventListener('keydown', function(e){
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-action="cycle-day"]')) {
      e.preventDefault(); e.target.click();
    }
  });

  wizard.addEventListener('input', function(e){
    var bind = e.target.dataset.bind;
    if (!bind) return;
    var t = activeT();
    if (bind.indexOf('trip.') === 0 || bind.indexOf('newCompanion.') === 0) set(state, bind, e.target.value);
    else set(t, bind, e.target.value);
  });
  wizard.addEventListener('change', function(e){
    var bind = e.target.dataset.bind;
    if (!bind) return;
    var t = activeT();
    if (bind.indexOf('trip.') === 0 || bind.indexOf('newCompanion.') === 0) set(state, bind, e.target.value);
    else set(t, bind, e.target.value);
    if (bind === 'trip.purpose') render();
  });

  render();
})();
</script>
